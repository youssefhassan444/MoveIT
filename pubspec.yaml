name: moveit

description: MoveIt — a production-ready delivery app for the Egyptian market.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.1.0
  hooks_riverpod: ^3.1.0
  flutter_hooks: ^0.21.2
  riverpod_annotation: ^4.0.0

  # Navigation
  go_router: ^17.2.3

  # Firebase
  firebase_core: ^4.8.0
  firebase_auth: ^6.5.0
  cloud_firestore: ^6.4.0
  firebase_storage: ^13.4.0
  firebase_messaging: ^16.2.1
  firebase_crashlytics: ^5.2.1

  # Maps & Location
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  geocoding: ^3.0.0

  # Media & Network
  image_picker: ^1.2.2
  cached_network_image: ^3.3.1
  http: ^1.2.1
  connectivity_plus: ^7.1.1

  # UI
  google_fonts: ^8.1.0
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_local_notifications: ^21.0.0

  # Utilities
  uuid: ^4.5.3
  intl: ^0.20.2
  shared_preferences: ^2.2.2

  # Code Generation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/moveit_master/